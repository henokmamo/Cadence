# Cadence CI

#

# Four outputs, all on free GitHub-hosted runners:

#

#   engine-tests  (Linux, ~40s)   builds CadenceCore and runs the scheduling tests.

#   ios-build     (macOS, ~5min)  compiles the app for the iOS Simulator AND builds

#                                 an unsigned physical-device Cadence.ipa ready for

#                                 free sideloading on Windows with Sideloadly.

#   ios-tests     (macOS)         runs the app-level tests on an iPhone simulator.



name: CI



on:

  push:

    branches: [main, master]

  pull_request:

  workflow_dispatch:



concurrency:

  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true



jobs:



  # ---------------------------------------------------------------- engine (fast)

  engine-tests:

    name: Engine tests (Linux, no Xcode)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4



      - name: Install Swift

        uses: swift-actions/setup-swift@v2

        with:

          swift-version: "6.0"



      - name: Show toolchain

        run: swift --version



      - name: Build the scheduling core

        run: swift build --package-path . -c release



      - name: Run engine + working-hours tests

        run: |

          set -o pipefail

          swift test --package-path . 2>&1 | tail -40



      - name: Validate the Xcode project offline

        run: python3 tools/ValidateXcodeProject.py



      - name: Audit call sites (advisory)

        run: python3 tools/AuditCallSites.py || echo "::warning::call-site audit found candidates — see the log above"



  # ------------------------------------------------------- app + widget (Xcode)

  ios-build:

    name: Build app + widget (macOS, Xcode)

    runs-on: macos-15

    steps:

      - uses: actions/checkout@v4



      - name: Show Xcode version

        run: xcodebuild -version



      - name: Preflight — make sure the project file is readable

        run: |

          set -e

          if [ ! -f Cadence.xcodeproj/project.pbxproj ]; then

            echo "::error::Cadence.xcodeproj/project.pbxproj is missing from the repository."

            exit 1

          fi

          plutil -lint Cadence.xcodeproj/project.pbxproj

          xcodebuild -list -project Cadence.xcodeproj



      - name: Build for the simulator (no signing required)

        run: |

          set -o pipefail

          xcodebuild build \

            -project Cadence.xcodeproj \

            -scheme Cadence \

            -configuration Debug \

            -destination 'generic/platform=iOS Simulator' \

            -derivedDataPath "$RUNNER_TEMP/DerivedData" \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -60 || {

              echo ""

              echo "==================== BUILD FAILED - COMPILATION ERRORS ===================="

              grep -E "(: error:|BUILD FAILED|failed:)" -B 2 -A 3 "$RUNNER_TEMP/xcodebuild.log" || tail -200 "$RUNNER_TEMP/xcodebuild.log"

              echo "==========================================================================="

              exit 1

            }



      - name: Package the simulator app

        run: |

          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "Cadence.app" -maxdepth 3 | head -1)

          echo "built simulator app: $APP"

          cd "$(dirname "$APP")" && zip -qry "$RUNNER_TEMP/Cadence-simulator.zip" "Cadence.app"

          ls -lh "$RUNNER_TEMP/Cadence-simulator.zip"



      - uses: actions/upload-artifact@v4

        with:

          name: Cadence-simulator-app

          path: ${{ runner.temp }}/Cadence-simulator.zip

          if-no-files-found: error



      - name: Build for physical iPhone (unsigned Release for Sideloadly)

        run: |

          set -o pipefail

          xcodebuild build \

            -project Cadence.xcodeproj \

            -scheme Cadence \

            -configuration Release \

            -sdk iphoneos \

            -destination 'generic/platform=iOS' \

            -derivedDataPath "$RUNNER_TEMP/DerivedDataDevice" \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            CODE_SIGN_IDENTITY="" \

            AD_HOC_CODE_SIGNING_ALLOWED=YES \

            2>&1 | tee "$RUNNER_TEMP/xcodebuild-device.log" | tail -60 || {

              echo ""

              echo "==================== DEVICE BUILD FAILED ===================="

              grep -E "(: error:|BUILD FAILED|failed:)" -B 2 -A 3 "$RUNNER_TEMP/xcodebuild-device.log" || tail -200 "$RUNNER_TEMP/xcodebuild-device.log"

              echo "============================================================="

              exit 1

            }



      - name: Package Cadence.ipa for Sideloadly

        run: |

          DEVICE_APP=$(find "$RUNNER_TEMP/DerivedDataDevice/Build/Products/Release-iphoneos" -name "Cadence.app" -maxdepth 2 | head -1)

          echo "built device app: $DEVICE_APP"

          mkdir -p "$RUNNER_TEMP/ipa-stage/Payload"

          cp -R "$DEVICE_APP" "$RUNNER_TEMP/ipa-stage/Payload/Cadence.app"

          # Free Apple IDs cannot sign App Group widget extensions; remove PlugIns so Sideloadly installs cleanly

          rm -rf "$RUNNER_TEMP/ipa-stage/Payload/Cadence.app/PlugIns"

          cd "$RUNNER_TEMP/ipa-stage" && zip -qry "$RUNNER_TEMP/Cadence.ipa" Payload

          ls -lh "$RUNNER_TEMP/Cadence.ipa"



      - uses: actions/upload-artifact@v4

        with:

          name: Cadence-iPhone-IPA

          path: ${{ runner.temp }}/Cadence.ipa

          if-no-files-found: error



  # ------------------------------------------------------------- app tests (Xcode)

  ios-tests:

    name: App tests (macOS, simulator)

    runs-on: macos-15

    needs: ios-build

    steps:

      - uses: actions/checkout@v4



      - name: Pick an available iPhone simulator

        id: sim

        run: |

          UDID=$(xcrun simctl list devices available -j \

            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          echo "Using simulator $UDID"



      - name: Run all tests

        run: |

          set -o pipefail

          xcodebuild test \

            -only-testing:CadenceTests \

            -project Cadence.xcodeproj \

            -scheme Cadence \

            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \

            -derivedDataPath "$RUNNER_TEMP/DerivedData" \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            | tail -80



      - name: Upload test results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: test-results

          path: ${{ runner.temp }}/DerivedData/Logs/Test/*.xcresult

          if-no-files-found: ignore

